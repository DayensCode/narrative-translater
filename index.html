<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Narrative is an offline-first speech translation PWA with browser-based recognition, translation and voice playback."
        />
        <meta name="theme-color" content="#f3efe6" />
        <title>Narrative</title>
        <script>
            // Anti-flash: applies the right theme before React mounts.
            (function () {
                try {
                    var saved = localStorage.getItem("narrative-theme");
                    var system = window.matchMedia(
                        "(prefers-color-scheme: dark)",
                    ).matches
                        ? "dark"
                        : "light";
                    var resolved =
                        saved === "dark" || saved === "light" ? saved : system;
                    document.documentElement.dataset.theme = resolved;
                    document.documentElement.style.colorScheme = resolved;
                } catch (e) {
                    // Private mode / disabled storage — fall back to CSS default.
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
